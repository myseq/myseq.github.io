# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
#baseURL = "https://nunocoracao.github.io/blowfish"
baseURL = "https://myseq.github.io/"
defaultContentLanguage = "en"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
#paginate = 100
#paginate = 5
#summaryLength = 30
summaryLength = 0

#buildDrafts = false
#buildFuture = false
#googleAnalytics = "G-PEDMYR1V0K"
googleAnalytics = "G-CQL491X0G6"

# 0.123 makes Capitalized Headings/Tags.
capitalizeListTitles = false    # Introducted in v0.123.3.
titleCaseStyle = 'none'         # Keep tags as all lowercase
slugReplacement = "_"

[pagination]
  disableAliases = false
  pagerSize = 5
  path = 'page'

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = ''
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

#[outputFormats]
#  [outputFormats.RSS]
#    mediaType = "application/rss+xml"
#    baseName = "feed"
[mediaTypes]
[mediaTypes."application/rss"]
suffixes = ["xml"]

[services]
  [services.rss]
    limit = -1

[related]
  threshold = 0
  #toLower = false
  toLower = true

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10

[security]
  #allowContent = ['! ^text/html$']
  #allowContent = ['^text/html$']
  allowContent = ['.*']
  enableInlineShortcodes = false

  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$']
    osEnv = ['(?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\w+|(XDG_CONFIG_)?HOME|USERPROFILE|SSH_AUTH_SOCK|DISPLAY|LANG|SYSTEMDRIVE|PROGRAMDATA)$']

  [security.funcs]
    getenv = ['^HUGO_', '^CI$']

  [security.http]
    methods = ['(?i)GET|POST']
    urls = ['(?i)^https?://[a-z0-9]', '! ^https?://\d+\.', '! (?i)localhost', '! (?i)^https?://[^/?#]*@']

  [security.node]
    [security.node.permissions]
      allowAddons = ['tailwindcss']
      allowChildProcess = ['tailwindcss']
      allowRead = ['.']
      allowWorker = ['tailwindcss']
      allowWrite = []
      disable = false
