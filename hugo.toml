theme = 'blowfish'
baseURL = 'https://myseq.github.io/'
title = 'MySeq'
defaultContentLanguage = "en"
locale = 'en-us'

enableEmoji = true
googleAnalytics = "G-CQL491X0G6"
paginationpapgerSize = 5
summaryLength = 0

[params]
  color = "neutral"                  # Theme color accent (neutral, slate, zinc, gray, orange, etc.)
  defaultTheme = "system"            # dark, light, or system
  autoSwitchTheme = true
  description = "Simplicity is the Ultimate Sophistication"
  copyright = " © Copyleft 🦎"
  colorScheme = "avocado"
  defaultAppearance = "dark"
  autoSwitchAppearance = true
  enableSearch = true
  #defaultBackgroundImage = "/images/penangnight.jpg"
  #defaultFeaturedImage = "/images/sunflower.jpg"
  highlightCurrentMenuArea = true
  smartTOC = true
  list.showSummary = true

  defaultBackgroundImage = "/images/background.jpeg"
  defaultFeaturedImage = "/images/featured.jpeg"
  fingerprintAlgorithm = "sha512"


# Author information (shows in footer and article headers)
[params.author]
  name = "MySeq"
  image = "img/author.png"         # Place image in your assets/img/ directory
  headline = "<mark>***Simplicity is the Ultimate Sophistication***</mark>"
  bio = "myseq.github.io"
  links = [
    { link = "https://myseq.github.io/" },
    { github = "https://github.com/myseq/" }
  ]

# Homepage settings
[params.homepage]
    #layout = "profile"               # Options: "profile", "hero", or "card"
    layout = "background"               # Options: "profile", "hero", or "card"
    #homepageImage = ""
    showRecent = true                # Display recent articles on homepage
    showMoreLink = true

    showRecentItems = 3
    #layoutSwitcher = false
    showMoreLinkDest = "/posts/"
    cardView = true        # false
    cardViewScreenWidth = false
    layoutBackgroundBlur = false # only used when layout equals background
    disableHeroImageFilter = false # only used when layout equals hero

    #homepageImage = "/images/pexels-neo-html.jpeg"
    homepageImage = "/images/background.jpeg"


# Header & Footer
[params.header]
    layout = "sticky"                # Fixed header on scroll
    mobileMenuStyle = "fullscreen"   # valid options: fullscreen, dropdown

[params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true


[params.article]
  showDate = true
  showViews = false
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = false
  showAuthor = true
  showAuthorBottom = true   # false
  showHero = false
  # heroStyle = "basic" # valid options: basic, big, background, thumbAndBackground
  heroStyle = "background"
  layout = "simple"
  layoutBackgroundBlur = true # only used when heroStyle equals background or thumbAndBackground
  layoutBackgroundHeaderSpace = true # only used when heroStyle equals background
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  # editURL = "https://github.com/username/repo/"
  editAppendPath = true
  seriesOpened = false
  showHeadingAnchors = true
  showPagination = false    # true   # showPrevious, showNext
  invertPagination = false
  showReadingTime = true
  showReadingProgress = false
  showTableOfContents = true   # false
  showRelatedContent = true    # false
  relatedContentLimit = 3
  showTaxonomies = true  # false # Enable the display of taxonomies for the related article.
  showCategories = true # These will show if showTaxonomies is true.
  showTags = true # These will show if showTaxonomies is true.
  showCategoriesInSecondaryColor = false # This will change the color of category badges, so the user can better disting uish between the two. Only if showTaxonomies is true.
  showAuthorsBadges = true   # false
  showWordCount = true
  showSummary = true
  # sharingLinks = [ "linkedin", "twitter", "bluesky", "mastodon", "reddit", "pinterest", "facebook", "email", "whatsapp ", "telegram", "line"]
  sharingLinks = [ "linkedin", "twitter", "reddit", "facebook" ]
  showZenMode = true    #false
  externalLinkForceNewTab = true   # false # disable to allow external links in the same tab (defaults to true)


[sitemap]
  excludedKinds = ["taxonomy", "term"]



[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"
  author = "authors"

[outputs]
  home = ["HTML", "RSS", "JSON"]


