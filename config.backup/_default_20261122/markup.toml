# -- Markup --
# These settings are required for the theme to function.

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.highlight]
    noClasses = true
    style = "arduino"   # Defaule: monokai
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    #noClasses = true
    #style = 'monokai'
    tabWidth = 4
    wrapperClass = 'highlight'

[goldmark]
  [goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

    [goldmark.parser.attribute]
      block = true

  [goldmark.renderer]
    unsafe = true

  [goldmark.extensions]
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

#[highlight]
#  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 4
